<html>
  <!-- Ultimate Game Stash file-->
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

  <head>
    <script src="//www.google.com/jsapi"></script>
    <script>
      window.parent.maeExportApis_();
    </script>

    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin-top: 0;
        margin-left: 0;
        color: #000000;
      }

      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 20px auto;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        box-shadow: 0px 0px 10px 2px #000000;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      #button {
        display: none;
      }

      .imgb_vis {
        animation: imgb-animation 7s linear;
      }

      @keyframes imgb-animation {
        10% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(100px);
        }

        90% {
          transform: translateX(100px);
        }

        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>
<body>
  <div style="width: 100vw; height: 100vh;">
    <button id="startButton">PLAY</button>
    <div id="game" style="display: none; width: 100%; height: 100%;"></div>
  </div>

  <script>
    document.getElementById("startButton").addEventListener("click", function() {
      document.getElementById("startButton").style.display = "none";
      document.getElementById("game").style.display = "block";

      window.EJS_player = "#game";
      window.EJS_biosUrl = '';
      window.EJS_gameUrl = 'Mk64.n64';
      window.EJS_core = 'parallel_n64';
      window.EJS_pathtodata = 'data/';
      window.EJS_defaultOptions = {
        vsync: "disabled",
      };

      var script = document.createElement("script");
      script.src = "data/loader.js";
      document.body.appendChild(script);

      var script2 = document.createElement("script");
      script2.src = "cloak.js";
      document.body.appendChild(script2);
    });
  </script>
</body>
</html>
